# ==============================================================================
# Ultimate Smile Design - AI Calling Agent
# aaPanel Nginx Production Configuration for Zero-Latency Audio Streaming
#
# Target File Location in aaPanel:
#   /www/server/panel/vhost/nginx/<your-domain>.conf
# Or via aaPanel Web UI:
#   Websites -> Select Domain -> Config (or Reverse Proxy)
# ==============================================================================

# 1. Connection Upgrade Mapping (place inside or outside http/server block)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Auto-redirect HTTP to HTTPS (Required by Tata Smartflo & WebSockets)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ==========================================================================
    # SSL Certificate Paths (Managed by aaPanel Let's Encrypt / SSL Manager)
    # Update paths to match your aaPanel site certificate
    # ==========================================================================
    ssl_certificate    /www/server/panel/vhost/cert/your-domain.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Access and Error Logs
    access_log  /www/wwwlogs/your-domain.com.log;
    error_log  /www/wwwlogs/your-domain.com.error.log;

    # Max body size for smile preview images and documents
    client_max_body_size 50M;

    # ==========================================================================
    # CRITICAL LOCATION 1: Smartflo Media Stream WebSocket
    # Strictly disables proxy buffering and Nagle's algorithm for sub-100ms audio
    # ==========================================================================
    location /smartflo/media-stream {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;

        # WebSocket handshake headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded identity headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # ----------------------------------------------------------------------
        # ZERO-LATENCY AUDIO STREAMING DIRECTIVES
        # ----------------------------------------------------------------------
        # 1. Disable Nginx buffering: Audio frames (320 bytes / 40ms) pass through instantly!
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # 2. Disable Nagle's algorithm: Transmit audio packets immediately without waiting for MTU
        tcp_nodelay on;
        tcp_nopush off;

        # 3. Long-Duration Phone Call Timeouts (prevents mid-call disconnection)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 15s;
    }

    # ==========================================================================
    # CRITICAL LOCATION 2: Generic WebSocket fallback (/ws/)
    # ==========================================================================
    location /ws/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        tcp_nodelay on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ==========================================================================
    # LOCATION 3: Static Assets (Audio caches, JS, CSS, Favicons)
    # ==========================================================================
    location /static/ {
        proxy_pass http://127.0.0.1:8050/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache browser static assets for 7 days (except dynamic audio)
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ==========================================================================
    # LOCATION 4: All Standard HTTP API Endpoints & Form Portals
    # ==========================================================================
    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;

        # WebSocket support for general routes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Standard buffer tuning for fast API JSON responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 15s;
    }
}
